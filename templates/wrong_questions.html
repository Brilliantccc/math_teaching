{% extends "base.html" %}
{% block title %}错题本 - 数学题库{% endblock %}
{% block content %}
<div class="page-header">
    <h2>📖 错题本</h2>
    <div style="display:flex;gap:0.5rem">
        <a href="/practice" class="btn btn-primary">开始练习</a>
        <a href="/practice/stats" class="btn btn-outline">练习统计</a>
    </div>
</div>

<!-- 筛选栏 -->
<div class="filter-row">
    <select class="form-control" id="wrongMastered" style="max-width:140px" onchange="loadWrongQuestions()">
        <option value="">全部错题</option>
        <option value="0">未掌握</option>
        <option value="1">已掌握</option>
    </select>
    <span id="wrongTotal" class="text-muted" style="margin-left:auto;font-size:0.9rem"></span>
</div>

<div id="wrongList"></div>
<div id="wrongPagination"></div>

<!-- 题目详情弹窗 -->
<div class="modal-overlay" id="wrongDetailModal" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="modal" id="wrongDetailContent"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let wrongPage = 1;

async function loadWrongQuestions() {
    const mastered = document.getElementById("wrongMastered").value;

    let url = `/api/practice/wrong-questions?page=${wrongPage}&per_page=15`;
    if (mastered !== "") url += `&mastered=${mastered}`;

    const data = await api.get(url);
    const list = document.getElementById("wrongList");

    document.getElementById("wrongTotal").textContent = `共 ${data.total} 道错题`;

    if (data.wrong_questions.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="icon">🎉</div>
                <p>暂无错题，继续保持！</p>
                <a class="btn btn-primary" href="/practice">去练习</a>
            </div>`;
        document.getElementById("wrongPagination").innerHTML = "";
        return;
    }

    list.innerHTML = data.wrong_questions.map(item => {
        const q = item.question || {};
        return `
        <div class="question-item" style="cursor:pointer" onclick="showWrongDetail(${q.id || 0})">
            <div style="flex:1">
                <div class="q-title">${escapeHtml(q.title) || "未命名题目"}</div>
                ${q.image_path ? `<img src="/static/${q.image_path}" style="max-width:200px;border-radius:4px;margin:0.5rem 0">` : ""}
                <div class="q-content">${escapeHtml(q.content) || ""}</div>
                <div class="q-meta">
                    ${gradeBadge(q.grade)}
                    ${q.category ? `<span class="category-badge">${escapeHtml(q.category)}</span>` : ""}
                    ${difficultyBadge(q.difficulty)}
                    ${renderTags(q.tags)}
                </div>
            </div>
            <div style="text-align:right;flex-shrink:0;padding-left:1rem">
                <div class="text-danger" style="font-weight:600;font-size:1.1rem">${item.wrong_count}次答错</div>
                <div class="text-placeholder" style="font-size:0.75rem;margin-top:0.25rem">${item.last_wrong_at || ""}</div>
                <button class="btn btn-sm ${item.mastered ? 'btn-success' : 'btn-outline'}" style="margin-top:0.5rem" onclick="event.stopPropagation();toggleMastered(${item.id})">${item.mastered ? '✓ 已掌握' : '标记掌握'}</button>
            </div>
        </div>
    `}).join("");

    document.getElementById("wrongPagination").innerHTML = renderPagination(data.page, data.pages, "goToWrongPage");
}

function goToWrongPage(p) { wrongPage = p; loadWrongQuestions(); }

async function showWrongDetail(id) {
    const q = await api.get(`/api/questions/${id}`);
    document.getElementById("wrongDetailContent").innerHTML = `
        <h3>${escapeHtml(q.title) || "未命名题目"}</h3>
        ${q.image_path ? `<img src="/static/${q.image_path}" style="max-width:100%;border-radius:8px;margin:1rem 0">` : ""}
        <p>${escapeHtml(q.content) || ""}</p>
        <div style="margin:1rem 0">${gradeBadge(q.grade)} ${q.category ? `<span class="category-badge">${escapeHtml(q.category)}</span>` : ""} ${difficultyBadge(q.difficulty)} ${renderTags(q.tags)}</div>
        <p><strong>答案：</strong>${escapeHtml(q.answer) || "暂无答案"}</p>
        ${q.analysis ? `<p><strong>解析：</strong>${escapeHtml(q.analysis)}</p>` : ''}
        <div style="margin-top:1.5rem;display:flex;gap:0.5rem">
            <button class="btn btn-primary btn-sm" onclick="retryQuestion(${q.id})">重新练习此题</button>
            <a href="/question/edit/${q.id}" class="btn btn-outline btn-sm">编辑</a>
        </div>
        <button class="btn btn-outline" style="margin-top:1rem" onclick="document.getElementById('wrongDetailModal').classList.remove('active')">关闭</button>
    `;
    document.getElementById("wrongDetailModal").classList.add("active");

    if (window.MathJax) {
        MathJax.typesetPromise([document.getElementById("wrongDetailContent")]);
    }
}

async function retryQuestion(id) {
    document.getElementById("wrongDetailModal").classList.remove("active");

    const q = await api.get(`/api/questions/${id}`);
    document.getElementById("wrongList").innerHTML = `
        <div class="practice-card" style="text-align:left">
            <p class="text-muted" style="margin-bottom:1rem">📖 重新练习</p>
            ${gradeBadge(q.grade)} ${difficultyBadge(q.difficulty)}
            <div class="question-text">${q.title || "请查看题目图片"}</div>
            ${q.image_path ? `<img src="/static/${q.image_path}" style="max-width:100%;max-height:300px;border-radius:8px;margin:1rem auto;display:block">` : ""}
            ${q.content ? `<p class="text-muted" style="margin-bottom:1rem">${q.content}</p>` : ""}
            <div style="margin-bottom:1rem">${renderTags(q.tags)}</div>
            <div class="answer-input">
                <input class="form-control" id="retryAnswerInput" placeholder="输入你的答案" onkeydown="if(event.key==='Enter')submitRetry(${q.id})">
            </div>
            <button class="btn btn-primary" onclick="submitRetry(${q.id})">提交答案</button>
            <div id="retryFeedback" style="margin-top:1rem"></div>
        </div>
    `;
    document.getElementById("retryAnswerInput").focus();
}

async function submitRetry(qId) {
    const answer = document.getElementById("retryAnswerInput").value.trim();
    if (!answer) { toast("请输入答案"); return; }

    const result = await api.post("/api/practice/submit", { question_id: qId, answer });
    const fb = document.getElementById("retryFeedback");

    if (result.is_correct) {
        fb.innerHTML = `<p class="result-correct">✓ 正确！</p>`;
    } else {
        fb.innerHTML = `<p class="result-wrong">✗ 错误</p><p>正确答案：<strong>${result.correct_answer || "暂无"}</strong></p>`;
    }

    fb.innerHTML += `
        <div style="display:flex;gap:0.5rem;margin-top:1rem">
            <button class="btn btn-primary" onclick="loadWrongQuestions()">返回错题本</button>
        </div>`;
    document.getElementById("retryAnswerInput").disabled = true;
}

async function toggleMastered(wqId) {
    const result = await api.post(`/api/practice/wrong-questions/${wqId}/master`);
    toast(result.mastered ? '已标记为掌握' : '已取消掌握标记', 2000, "success");
    loadWrongQuestions();
}

// 初始化
loadWrongQuestions();
</script>
{% endblock %}
