<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>登录 - 数学题库管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-page); }
        .login-container {
            background: var(--bg-card); padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-md); width: 100%; max-width: 400px;
        }
        h1 { text-align: center; color: var(--text-primary); margin-bottom: 30px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 500; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid var(--border-input); border-radius: 6px;
            font-size: 16px; transition: border-color 0.3s; background: var(--bg-input); color: var(--text-body);
        }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: var(--primary-accent); }
        button {
            width: 100%; padding: 14px; background: var(--primary-accent); color: white; border: none;
            border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.3s;
        }
        button:hover { background: var(--primary-hover); }
        .error { color: var(--red); text-align: center; margin-bottom: 20px; padding: 10px; background: var(--red-bg-light); border-radius: 6px; }
        .forgot-link { text-align: center; margin-top: 15px; }
        .forgot-link a { color: var(--primary-accent); text-decoration: none; font-size: 14px; }
        .forgot-link a:hover { text-decoration: underline; }
        .theme-toggle-login { position: fixed; top: 1rem; right: 1rem; display: inline-flex; background: var(--bg-hover); border-radius: 6px; padding: 2px; gap: 2px; }
        .theme-toggle-login button { width: auto; padding: 0.3rem 0.6rem; font-size: 1rem; background: none; border-radius: 4px; color: var(--text-muted); }
        .theme-toggle-login button.active { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 1px 3px var(--shadow-sm); }
    </style>
</head>
<body>
    <div class="theme-toggle-login">
        <button data-theme="light" onclick="setTheme('light')" title="亮色模式">☀️</button>
        <button data-theme="dark" onclick="setTheme('dark')" title="暗色模式">🌙</button>
        <button data-theme="system" onclick="setTheme('system')" title="跟随系统">💻</button>
    </div>
    <div class="login-container">
        <h1>📚 数学题库管理系统</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">登录</button>
        </form>
        <div class="forgot-link">
            <a href="/forgot-password">忘记密码？</a>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
