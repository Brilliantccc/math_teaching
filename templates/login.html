<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>登录 - 数学题库管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; }
        .login-card h1 { text-align: center; margin-bottom: 1.5rem; }
        .login-card .error { margin-bottom: 1rem; }
        .login-links { text-align: center; margin-top: 1rem; }
        .login-links a { color: var(--primary); text-decoration: none; font-size: 0.9rem; }
        .login-links a:hover { text-decoration: underline; }
        .login-links .sep { color: var(--text-muted); margin: 0 0.5rem; }
        .theme-toggle-login { position: fixed; top: 1rem; right: 1rem; }
    </style>
</head>
<body>
    <div class="theme-toggle theme-toggle-login">
        <button data-theme="light" onclick="setTheme('light')" title="亮色模式">☀️</button>
        <button data-theme="dark" onclick="setTheme('dark')" title="暗色模式">🌙</button>
        <button data-theme="system" onclick="setTheme('system')" title="跟随系统">💻</button>
    </div>
    <div class="card login-card">
        <h1>📚 数学题库管理系统</h1>
        {% if error %}
        <div class="alert alert-error error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input class="form-control" type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%">登录</button>
        </form>
        <div class="login-links">
            <a href="/forgot-password">忘记密码？</a>
            <span class="sep">|</span>
            <a href="/register">注册新账号</a>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
