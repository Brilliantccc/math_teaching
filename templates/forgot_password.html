<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>忘记密码 - 数学题库管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: var(--bg-page);
        }
        .container {
            background: var(--bg-card); padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-md); width: 100%; max-width: 420px;
        }
        h1 { text-align: center; color: var(--text-primary); margin-bottom: 10px; font-size: 24px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 500; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid var(--border-input); border-radius: 6px;
            font-size: 16px; transition: border-color 0.3s; background: var(--bg-input); color: var(--text-body);
        }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: var(--primary-accent); }
        button {
            width: 100%; padding: 14px; background: var(--primary-accent); color: white; border: none;
            border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.3s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: var(--border-input); cursor: not-allowed; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .alert-error { background: var(--red-bg-light); color: var(--red); border: 1px solid var(--red-border); }
        .alert-success { background: var(--green-bg-light); color: var(--green); border: 1px solid var(--green-border); }
        .alert-info { background: var(--batch-bg); color: var(--primary); border: 1px solid var(--batch-border); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--primary-accent); text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .help-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
        .help-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
        .help-content { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
        .help-content code { background: var(--bg-hover); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: var(--red); }
        .step-list { margin: 10px 0; padding-left: 20px; }
        .step-list li { margin-bottom: 8px; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: var(--text-placeholder); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }
        .theme-toggle-login { position: fixed; top: 1rem; right: 1rem; display: inline-flex; background: var(--bg-hover); border-radius: 6px; padding: 2px; gap: 2px; }
        .theme-toggle-login button { width: auto; padding: 0.3rem 0.6rem; font-size: 1rem; background: none; border-radius: 4px; color: var(--text-muted); }
        .theme-toggle-login button.active { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 1px 3px var(--shadow-sm); }
    </style>
</head>
<body>
    <div class="theme-toggle-login">
        <button data-theme="light" onclick="setTheme('light')" title="亮色模式">☀️</button>
        <button data-theme="dark" onclick="setTheme('dark')" title="暗色模式">🌙</button>
        <button data-theme="system" onclick="setTheme('system')" title="跟随系统">💻</button>
    </div>
    <div class="container">
        <h1>🔑 重置密码</h1>
        <p class="subtitle">通过重置码恢复账户访问</p>

        <div id="alertBox"></div>

        <form id="resetForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="resetCode">重置码</label>
                <input type="text" id="resetCode" name="reset_code" placeholder="请输入重置码" required>
            </div>

            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" name="new_password" placeholder="至少6位" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="再次输入新密码" required minlength="6">
            </div>

            <button type="submit" id="submitBtn">重置密码</button>
        </form>

        <a href="/login" class="back-link">← 返回登录</a>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const resetCode = document.getElementById('resetCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            if (newPassword !== confirmPassword) {
                alertBox.innerHTML = '<div class="alert alert-error">两次输入的密码不一致</div>';
                return;
            }

            if (newPassword.length < 6) {
                alertBox.innerHTML = '<div class="alert alert-error">密码长度不能少于6位</div>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '重置中...';

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        reset_code: resetCode,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
                    document.getElementById('resetForm').reset();
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    alertBox.innerHTML = '<div class="alert alert-error">' + data.error + '</div>';
                }
            } catch (err) {
                alertBox.innerHTML = '<div class="alert alert-error">网络错误，请稍后重试</div>';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '重置密码';
        });
    </script>
</body>
</html>
