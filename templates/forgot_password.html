<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>忘记密码 - 数学题库管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reset-card { width: 100%; max-width: 420px; }
        .reset-card h1 { text-align: center; margin-bottom: 0.5rem; }
        .reset-card .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .back-link { display: block; text-align: center; margin-top: 1rem; color: var(--primary); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        .theme-toggle-login { position: fixed; top: 1rem; right: 1rem; }
    </style>
</head>
<body>
    <div class="theme-toggle theme-toggle-login">
        <button data-theme="light" onclick="setTheme('light')" title="亮色模式">☀️</button>
        <button data-theme="dark" onclick="setTheme('dark')" title="暗色模式">🌙</button>
        <button data-theme="system" onclick="setTheme('system')" title="跟随系统">💻</button>
    </div>
    <div class="card reset-card">
        <h1>🔑 重置密码</h1>
        <p class="subtitle">通过重置码恢复账户访问</p>

        <div id="alertBox"></div>

        <form id="resetForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="resetCode">重置码</label>
                <input class="form-control" type="text" id="resetCode" name="reset_code" placeholder="请输入重置码" required>
            </div>

            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input class="form-control" type="password" id="newPassword" name="new_password" placeholder="至少6位" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input class="form-control" type="password" id="confirmPassword" name="confirm_password" placeholder="再次输入新密码" required minlength="6">
            </div>

            <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%">重置密码</button>
        </form>

        <a href="/login" class="back-link">← 返回登录</a>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const resetCode = document.getElementById('resetCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            if (newPassword !== confirmPassword) {
                alertBox.innerHTML = '<div class="alert alert-error">两次输入的密码不一致</div>';
                return;
            }

            if (newPassword.length < 6) {
                alertBox.innerHTML = '<div class="alert alert-error">密码长度不能少于6位</div>';
                return;
            }

            showLoading(submitBtn);

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        reset_code: resetCode,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
                    document.getElementById('resetForm').reset();
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    alertBox.innerHTML = '<div class="alert alert-error">' + data.error + '</div>';
                }
            } catch (err) {
                alertBox.innerHTML = '<div class="alert alert-error">网络错误，请稍后重试</div>';
            }

            hideLoading(submitBtn);
        });
    </script>
</body>
</html>
