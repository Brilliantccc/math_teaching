{% extends "base.html" %}
{% block title %}编辑题目 - 数学题库{% endblock %}
{% block content %}
<div class="page-header">
    <h1>编辑题目</h1>
    <a href="/manage" class="btn btn-outline">← 返回题库管理</a>
</div>

<div class="upload-container">
    <form id="editForm" enctype="multipart/form-data">
        <input type="hidden" id="questionId" value="{{ question_id }}">

        <div class="form-row">
            <div class="form-group">
                <label>年级</label>
                <select id="grade" name="grade">
                    {% for g in grades %}
                    <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>分类</label>
                <select id="category" name="category">
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>难度</label>
                <select id="difficulty" name="difficulty">
                    <option value="1">简单</option>
                    <option value="2">中等</option>
                    <option value="3">困难</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>题目名称</label>
            <input type="text" id="title" name="title" placeholder="输入题目名称（可选）">
        </div>

        <div class="form-group">
            <label>题目内容</label>
            <textarea id="content" name="content" rows="6" placeholder="输入题目内容，支持LaTeX公式（用 $...$ 包裹）"></textarea>
            <div class="preview-box" id="contentPreview"></div>
        </div>

        <div class="form-group">
            <label>知识点标签</label>
            <div class="tag-selector" id="tagSelector">
                <div class="selected-tags" id="selectedTags"></div>
                <div class="tag-dropdown" id="tagDropdown">
                    {% for cat, tags in categories_detail.items() %}
                    <div class="tag-group">
                        <div class="tag-group-title">{{ cat }}</div>
                        {% for tag in tags %}
                        <label class="tag-option">
                            <input type="checkbox" value="{{ tag }}" onchange="toggleTag('{{ tag }}')">
                            <span>{{ tag }}</span>
                        </label>
                        {% endfor %}
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>图片（可选）</label>
            <div class="upload-area" id="imageUploadArea">
                <input type="file" id="imageInput" name="image" accept="image/*" style="display:none">
                <div class="upload-placeholder" onclick="document.getElementById('imageInput').click()">
                    <span class="icon">📷</span>
                    <p>点击或拖拽上传图片</p>
                </div>
                <div class="image-preview" id="imagePreview" style="display:none">
                    <img id="previewImg">
                    <button type="button" class="btn-remove" onclick="removeImage()">×</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>答案</label>
            <textarea id="answer" name="answer" rows="3" placeholder="输入答案"></textarea>
        </div>

        <div class="form-group">
            <label>解析（可选）</label>
            <textarea id="analysis" name="analysis" rows="4" placeholder="输入解题分析"></textarea>
        </div>

        <div class="form-group">
            <label>来源</label>
            <input type="text" id="source" name="source" placeholder="题目来源（可选）">
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="window.location.href='/manage'">取消</button>
            <button type="submit" class="btn btn-primary">保存修改</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
let selectedTags = [];
let currentImageFile = null;

// 页面加载时获取题目数据
document.addEventListener('DOMContentLoaded', async () => {
    const questionId = document.getElementById('questionId').value;
    const data = await api.get(`/api/questions/${questionId}`);

    if (data.error) {
        toast('题目不存在');
        window.location.href = '/manage';
        return;
    }

    // 填充表单
    document.getElementById('grade').value = data.grade || '初一';
    document.getElementById('category').value = data.category || '';
    document.getElementById('difficulty').value = data.difficulty || 1;
    document.getElementById('title').value = data.title || '';
    document.getElementById('content').value = data.content || '';
    document.getElementById('answer').value = data.answer || '';
    document.getElementById('analysis').value = data.analysis || '';
    document.getElementById('source').value = data.source || '';

    // 解析标签
    try {
        selectedTags = JSON.parse(data.tags || '[]');
        renderSelectedTags();
        // 勾选已选标签
        document.querySelectorAll('#tagDropdown input[type="checkbox"]').forEach(cb => {
            cb.checked = selectedTags.includes(cb.value);
        });
    } catch(e) {}

    // 显示已有图片
    if (data.image_path) {
        document.getElementById('previewImg').src = '/static/' + data.image_path;
        document.getElementById('imagePreview').style.display = 'block';
        document.querySelector('.upload-placeholder').style.display = 'none';
    }

    // 实时预览
    document.getElementById('content').addEventListener('input', updatePreview);
    updatePreview();
});

function updatePreview() {
    const content = document.getElementById('content').value;
    document.getElementById('contentPreview').innerHTML = content || '<span style="color:#999">预览区域</span>';
    if (window.MathJax) {
        MathJax.typesetPromise([document.getElementById('contentPreview')]);
    }
}

function toggleTag(tag) {
    const idx = selectedTags.indexOf(tag);
    if (idx === -1) {
        selectedTags.push(tag);
    } else {
        selectedTags.splice(idx, 1);
    }
    renderSelectedTags();
}

function renderSelectedTags() {
    const container = document.getElementById('selectedTags');
    container.innerHTML = selectedTags.map(t =>
        `<span class="tag">${escapeHtml(t)} <button type="button" onclick="removeTag('${escapeHtml(t)}')">×</button></span>`
    ).join('');
}

function removeTag(tag) {
    selectedTags = selectedTags.filter(t => t !== tag);
    renderSelectedTags();
    document.querySelectorAll('#tagDropdown input[type="checkbox"]').forEach(cb => {
        if (cb.value === tag) cb.checked = false;
    });
}

// 图片上传
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    currentImageFile = file;
    const reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('imagePreview').style.display = 'block';
        document.querySelector('.upload-placeholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
});

function removeImage() {
    currentImageFile = null;
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.querySelector('.upload-placeholder').style.display = 'flex';
}

// 提交表单
document.getElementById('editForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const questionId = document.getElementById('questionId').value;

    const formData = new FormData();
    formData.append('title', document.getElementById('title').value);
    formData.append('content', document.getElementById('content').value);
    formData.append('tags', JSON.stringify(selectedTags));
    formData.append('difficulty', document.getElementById('difficulty').value);
    formData.append('answer', document.getElementById('answer').value);
    formData.append('analysis', document.getElementById('analysis').value);
    formData.append('source', document.getElementById('source').value);
    formData.append('grade', document.getElementById('grade').value);
    formData.append('category', document.getElementById('category').value);

    if (currentImageFile) {
        formData.append('image', currentImageFile);
    }

    // 先更新基本信息
    await api.put(`/api/questions/${questionId}`, {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        tags: JSON.stringify(selectedTags),
        difficulty: parseInt(document.getElementById('difficulty').value),
        source: document.getElementById('source').value,
        answer: document.getElementById('answer').value,
        grade: document.getElementById('grade').value,
        category: document.getElementById('category').value
    });

    toast('题目已更新');
    window.location.href = '/manage';
});
</script>
{% endblock %}
