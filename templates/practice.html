{% extends "base.html" %}
{% block title %}练习模式 - 数学题库{% endblock %}
{% block content %}
<h2 class="page-heading">练习模式</h2>

<div id="setupPanel" class="card">
    <h3>开始练习</h3>
    <div class="form-group">
        <label>年级</label>
        <select class="form-control" id="practiceGrade" onchange="loadPracticeTags()">
            <option value="">全部年级</option>
            {% for g in grades %}<option value="{{g}}">{{g}}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>知识点（可选，不选则随机抽题）</label>
        <select class="form-control" id="practiceTag">
            <option value="">全部知识点</option>
        </select>
    </div>
    <div class="form-group">
        <label>题目数量</label>
        <input class="form-control" type="number" id="practiceCount" value="5" min="1" max="30">
    </div>
    <button class="btn btn-primary btn-lg" onclick="startPractice()">开始练习</button>
</div>

<div id="practicePanel" class="practice-card hidden"></div>

<div id="resultPanel" class="practice-card hidden"></div>
{% endblock %}

{% block scripts %}
<script>
let practiceQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let sessionResults = [];

// Set default grade
document.getElementById("practiceGrade").value = currentGrade;

// Load tags filtered by grade
async function loadPracticeTags() {
    const grade = document.getElementById("practiceGrade").value;
    const data = await api.get("/api/tags?grade=" + grade);
    const sel = document.getElementById("practiceTag");
    sel.innerHTML = '<option value="">全部知识点</option>';
    data.tags.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
    });
}
loadPracticeTags();

async function startPractice() {
    const tag = document.getElementById("practiceTag").value;
    const count = parseInt(document.getElementById("practiceCount").value) || 5;
    const grade = document.getElementById("practiceGrade").value;

    const btn = document.querySelector("#setupPanel .btn-primary");
    showLoading(btn);
    const result = await api.post("/api/practice/session", { tag, count, grade });
    hideLoading(btn);

    if (result.question_ids.length === 0) {
        toast("没有足够的题目，请先上传一些题目或调整筛选条件", 3000, "error");
        return;
    }

    const batchData = await api.get(`/api/questions/batch?ids=${result.question_ids.join(",")}`);
    practiceQuestions = batchData.questions;

    currentIndex = 0;
    correctCount = 0;
    sessionResults = [];

    document.getElementById("setupPanel").classList.add("hidden");
    document.getElementById("resultPanel").classList.add("hidden");
    document.getElementById("practicePanel").classList.remove("hidden");

    showQuestion();
}

function exitPractice() {
    if (confirm("确定要退出练习吗？当前进度将不会保存。")) {
        practiceQuestions = [];
        currentIndex = 0;
        correctCount = 0;
        sessionResults = [];
        document.getElementById("practicePanel").classList.add("hidden");
        document.getElementById("setupPanel").classList.remove("hidden");
    }
}

function showQuestion() {
    if (currentIndex >= practiceQuestions.length) {
        showResults();
        return;
    }

    const q = practiceQuestions[currentIndex];
    const pct = Math.round((currentIndex / practiceQuestions.length) * 100);
    document.getElementById("practicePanel").innerHTML = `
        <div class="practice-header">
            <div class="practice-progress">
                <div class="practice-progress-bar">
                    <div class="practice-progress-fill" style="width:${pct}%"></div>
                </div>
                <span class="practice-progress-text">${currentIndex + 1} / ${practiceQuestions.length}</span>
            </div>
            <button class="btn btn-outline btn-sm" onclick="exitPractice()">退出练习</button>
        </div>
        <div class="practice-body">
            ${gradeBadge(q.grade)} ${difficultyBadge(q.difficulty)}
            <div class="question-text">${q.title || "请查看题目图片"}</div>
            ${q.image_path ? `<img src="/static/${q.image_path}" class="practice-image">` : ""}
            ${q.content ? `<p class="text-muted practice-content">${q.content}</p>` : ""}
            <div class="practice-tags">${renderTags(q.tags)}</div>
            <div class="answer-input">
                <input class="form-control" id="answerInput" placeholder="输入你的答案" onkeydown="if(event.key==='Enter')submitAnswer()">
            </div>
            <div class="practice-actions">
                <button class="btn btn-outline" onclick="skipQuestion()">跳过此题</button>
                <button class="btn btn-primary" onclick="submitAnswer()">提交答案</button>
            </div>
            <div id="feedback" class="practice-feedback"></div>
        </div>
    `;
    document.getElementById("answerInput").focus();
}

function skipQuestion() {
    const q = practiceQuestions[currentIndex];
    sessionResults.push({ question: q, userAnswer: "(跳过)", isCorrect: false });
    currentIndex++;
    showQuestion();
}

async function submitAnswer() {
    const answer = document.getElementById("answerInput").value.trim();
    if (!answer) { toast("请输入答案"); return; }

    const q = practiceQuestions[currentIndex];
    const result = await api.post("/api/practice/submit", {
        question_id: q.id,
        answer,
    });

    const fb = document.getElementById("feedback");
    sessionResults.push({ question: q, userAnswer: answer, isCorrect: result.is_correct });

    if (result.is_correct) {
        correctCount++;
        fb.innerHTML = `<p class="result-correct">✓ 正确！</p>`;
    } else {
        let analysisHtml = "";
        if (q.analysis) {
            analysisHtml = `<div class="practice-analysis"><strong>解析：</strong>${q.analysis}</div>`;
        }
        fb.innerHTML = `
            <p class="result-wrong">✗ 错误</p>
            <p>正确答案：<strong>${result.correct_answer || "暂无"}</strong></p>
            ${analysisHtml}
        `;
    }

    fb.innerHTML += `<button class="btn btn-outline practice-next-btn" onclick="nextQuestion()">下一题 →</button>`;
    document.getElementById("answerInput").disabled = true;
    document.querySelector(".practice-actions").style.display = "none";
}

function nextQuestion() {
    currentIndex++;
    showQuestion();
}

function showResults() {
    document.getElementById("practicePanel").classList.add("hidden");
    const pct = Math.round((correctCount / practiceQuestions.length) * 100);
    let msg = pct >= 80 ? "太棒了！" : pct >= 60 ? "还不错，继续加油！" : "多练习，一定能进步！";

    const panel = document.getElementById("resultPanel");
    panel.classList.remove("hidden");
    panel.innerHTML = `
        <h2>练习结束</h2>
        <div class="result-score text-primary">${pct}%</div>
        <p>答对 ${correctCount} / ${practiceQuestions.length} 题</p>
        <p class="result-message">${msg}</p>
        <div class="result-list">
            ${sessionResults.map((r, i) => `
                <div class="border-light result-item">
                    <span>${i + 1}. ${r.question.title || "未命名"}</span>
                    <span class="result-icon">${r.isCorrect ? "✓" : "✗"}</span>
                    <div class="text-muted" style="font-size:0.85rem">
                        你的答案: ${r.userAnswer} | 正确答案: ${r.question.answer || "暂无"}
                    </div>
                </div>
            `).join("")}
        </div>
        <div class="result-actions">
            <button class="btn btn-primary btn-lg" onclick="location.reload()">再来一轮</button>
            <a href="/wrong-questions" class="btn btn-outline btn-lg">查看错题本</a>
        </div>
    `;
}
</script>
{% endblock %}
