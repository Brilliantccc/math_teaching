<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}数学题库{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">数学题库</a>
            <select id="globalGradeSelect" class="grade-select" onchange="onGradeChange(this.value)">
                <option value="初一">初一</option>
                <option value="初二">初二</option>
                <option value="初三">初三</option>
                <option value="高一">高一</option>
                <option value="高二">高二</option>
                <option value="高三">高三</option>
            </select>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">☰</button>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/manage">题库管理</a>
                <a href="/upload">上传题目</a>
                <a href="/paper-manage">试卷管理</a>
                <a href="/test">智能组卷</a>
                <a href="/practice">练习模式</a>
                <a href="/wrong-questions">错题本</a>
                <a href="/change-password" class="nav-link-item">修改密码</a>
                <a href="/logout" class="nav-logout">退出登录</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">数学题库管理系统</footer>
    <script src="/static/js/app.js"></script>
    <!-- MathJax 配置 -->
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true,
            processEnvironments: true
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
