{% extends "base.html" %}
{% block title %}练习统计 - 数学题库{% endblock %}
{% block content %}
<div class="page-header">
    <h1>练习统计</h1>
    <div style="display:flex;gap:0.5rem">
        <a href="/wrong-questions" class="btn btn-primary">📖 错题本</a>
        <a href="/practice" class="btn btn-outline">← 返回练习</a>
    </div>
</div>

<!-- 总览卡片 -->
<div class="stats-overview">
    <div class="stat-card">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">总练习次数</div>
    </div>
    <div class="stat-card stat-success">
        <div class="stat-value" id="correctCount">0</div>
        <div class="stat-label">正确次数</div>
    </div>
    <div class="stat-card stat-primary">
        <div class="stat-value" id="accuracy">0%</div>
        <div class="stat-label">正确率</div>
    </div>
</div>

<div class="grid grid-2">
    <!-- 按知识点统计 -->
    <div class="card">
        <h3>按知识点统计</h3>
        <div id="tagStats"></div>
    </div>

    <!-- 按难度统计 -->
    <div class="card">
        <h3>按难度统计</h3>
        <div id="diffStats"></div>
    </div>
</div>

<!-- 最近练习记录 -->
<div class="card" style="margin-top:1.5rem">
    <h3>最近练习记录</h3>
    <div id="recentRecords"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadStats);

async function loadStats() {
    const data = await api.get('/api/practice/stats');

    // 更新总览
    document.getElementById('totalCount').textContent = data.total;
    document.getElementById('correctCount').textContent = data.correct;
    document.getElementById('accuracy').textContent = data.accuracy + '%';

    // 渲染知识点统计
    const tagStatsHtml = (data.tag_stats || [])
        .slice(0, 10)
        .map(item => {
            const rate = Math.round(item.accuracy);
            return `
                <div class="stat-row">
                    <span class="stat-name">${escapeHtml(item.tag)}</span>
                    <div class="stat-bar-container">
                        <div class="stat-bar ${rate >= 60 ? 'bar-green' : 'bar-amber'}" style="transform: scaleX(${rate / 100})"></div>
                    </div>
                    <span class="stat-rate">${rate}%</span>
                    <span class="stat-count">(${item.correct}/${item.total})</span>
                </div>
            `;
        }).join('');
    document.getElementById('tagStats').innerHTML = tagStatsHtml || '<p class="text-placeholder">暂无数据</p>';

    // 渲染难度统计
    const diffLabels = {1: '简单', 2: '中等', 3: '困难'};
    const diffStatsMap = {};
    (data.difficulty_stats || []).forEach(d => { diffStatsMap[d.difficulty] = d; });
    const diffStatsHtml = [1, 2, 3].map(diff => {
        const stats = diffStatsMap[diff] || {total: 0, correct: 0};
        const rate = stats.total > 0 ? Math.round(stats.accuracy || (stats.correct / stats.total * 100)) : 0;
        return `
            <div class="stat-row">
                <span class="stat-name">${diffLabels[diff]}</span>
                <div class="stat-bar-container">
                    <div class="stat-bar bar-diff-${diff}" style="transform: scaleX(${rate / 100})"></div>
                </div>
                <span class="stat-rate">${rate}%</span>
                <span class="stat-count">(${stats.correct}/${stats.total})</span>
            </div>
        `;
    }).join('');
    document.getElementById('diffStats').innerHTML = diffStatsHtml;

    // 渲染最近记录
    if (data.recent.length === 0) {
        document.getElementById('recentRecords').innerHTML = '<p class="text-placeholder">暂无练习记录</p>';
    } else {
        const recentHtml = data.recent.map(r => `
            <div class="record-item">
                <span class="record-status ${r.is_correct ? 'correct' : 'wrong'}">${r.is_correct ? '✓' : '✗'}</span>
                <span class="record-title">${escapeHtml(r.question_title) || '未命名题目'}</span>
                <span class="record-time">${r.created_at || ''}</span>
            </div>
        `).join('');
        document.getElementById('recentRecords').innerHTML = recentHtml;
    }
}
</script>
{% endblock %}
