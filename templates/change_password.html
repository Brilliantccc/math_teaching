{% extends "base.html" %}
{% block title %}修改密码 - 数学题库{% endblock %}
{% block content %}
<div class="page-header">
    <h1>修改密码</h1>
    <a href="/" class="btn btn-outline">← 返回首页</a>
</div>

<div class="change-password-container">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="old_password">原密码</label>
                <input type="password" id="old_password" name="old_password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="6">
                <small style="color: #6b7280; margin-top: 0.25rem; display: block;">密码长度至少6位</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
            </div>

            <div class="form-actions" style="margin-top: 1.5rem;">
                <button type="button" class="btn btn-outline" onclick="window.location.href='/'">取消</button>
                <button type="submit" class="btn btn-primary">确认修改</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 密码匹配验证
document.getElementById('confirm_password').addEventListener('input', function() {
    const newPwd = document.getElementById('new_password').value;
    const confirmPwd = this.value;

    if (confirmPwd && newPwd !== confirmPwd) {
        this.setCustomValidity('两次输入的密码不一致');
    } else {
        this.setCustomValidity('');
    }
});
</script>
{% endblock %}
